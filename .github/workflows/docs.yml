name: docs

# Builds the VitePress site and deploys it to GitHub Pages.
#
# Isolation from the daily sync-and-release run is automatic: that workflow
# pushes its version-bump commits with GITHUB_TOKEN, and commits pushed with
# GITHUB_TOKEN do not trigger downstream `on: push` workflows. So only manual
# pushes (a human editing docs or bumping vitepress) deploy here — version
# bumps never cause a docs rebuild.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment; don't cancel a run in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
