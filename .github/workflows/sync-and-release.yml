name: sync-and-release

# Polls npm for a new @deepseek-ai/dsh release, and when one appears (or a
# forced manual run asks for it) bumps the pinned dependency, tags a new
# desktop version, and publishes signed-less macOS/Windows installers to
# GitHub Releases. One workflow by design: a tag pushed with GITHUB_TOKEN
# would not trigger a second workflow.

on:
  schedule:
    # 09:00 / 13:00 / 17:00 Beijing time (UTC+8), three builds a day.
    - cron: '0 1,5,9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even when upstream is unchanged'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-and-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      version: ${{ steps.sync.outputs.version }}
      upstream_version: ${{ steps.sync.outputs.upstream_version }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: sync
        run: |
          args=()
          if [ "${{ inputs.force }}" = "true" ]; then args+=(--force); fi
          node scripts/sync-upstream.mjs "${args[@]}"

      - name: Refresh lockfile for the new upstream version
        if: steps.sync.outputs.changed == 'true'
        run: pnpm install --lockfile-only

      - name: Commit, tag, and push the bump
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(sync): @deepseek-ai/dsh ${{ steps.sync.outputs.upstream_version }}"
          git tag "v${{ steps.sync.outputs.version }}"
          git push origin HEAD:master --tags

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            builder-flag: --mac
          - os: windows-latest
            builder-flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.sync.outputs.version }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Build installer (no publish — release is assembled below to avoid
          parallel-build race on the same tag)
        run: pnpm exec electron-builder ${{ matrix.builder-flag }} --publish never
        env:
          # Unsigned on purpose (no Apple Developer / code-signing budget):
          # installers show the platform's unknown-developer warning.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist-installer/*.dmg
            dist-installer/*.zip
            dist-installer/*.exe
            dist-installer/*.blockmap
            dist-installer/latest*.yml
          if-no-files-found: error

  release:
    needs: [sync, build]
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create published release with all installers
        run: |
          mapfile -t files < <(find artifacts -type f | sort)
          cat > notes.md <<'EOF'
          **English**

          Built on [@deepseek-ai/dsh UPSTREAM_VERSION](https://www.npmjs.com/package/@deepseek-ai/dsh/v/UPSTREAM_VERSION). Unsigned build:

          - **macOS**: confirm via right-click → Open. If it says "damaged and can't be opened", run: `xattr -cr "/Applications/DSH Desktop.app"`
          - **Windows**: SmartScreen prompt → More info → Run anyway.

          **中文**

          基于 [@deepseek-ai/dsh UPSTREAM_VERSION](https://www.npmjs.com/package/@deepseek-ai/dsh/v/UPSTREAM_VERSION) 构建。未签名版本：

          - **macOS**：首次打开请右键 → 打开；若提示「已损坏，无法打开」，请执行：`xattr -cr "/Applications/DSH Desktop.app"`
          - **Windows**：SmartScreen 提示 → 更多信息 → 仍要运行。
          EOF
          sed -i "s/UPSTREAM_VERSION/${{ needs.sync.outputs.upstream_version }}/g" notes.md
          gh release create "v${{ needs.sync.outputs.version }}" \
            --repo foolgry/dsh-desktop \
            --title "v${{ needs.sync.outputs.version }}" \
            --notes-file notes.md \
            "${files[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
